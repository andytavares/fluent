# server.properties for node 3 of a 3-node KRaft cluster (combined broker+controller)

node.id=3
process.roles=broker,controller

# Bind both the client-facing and controller listeners on every interface.
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

# What clients outside the container/host network are told to connect to.
# The controller listener is never advertised — it's cluster-internal only.
advertised.listeners=PLAINTEXT://broker-3.internal:9092

controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

# Must be identical across all three nodes' configs.
controller.quorum.voters=1@broker-1.internal:9093,2@broker-2.internal:9093,3@broker-3.internal:9093

log.dirs=/var/lib/kafka/data
