# clickstream topic configuration
# Passed to: kafka-topics.sh --create --topic clickstream --config <this file>

# topic=clickstream
# partitions=12
# replication.factor=3

# Plain event log for reprocessing — delete old segments, don't compact.
cleanup.policy=delete

# Retain exactly 7 days of history.
retention.ms=604800000

# A write is only "committed" once 2 in-sync replicas have it.
min.insync.replicas=2
