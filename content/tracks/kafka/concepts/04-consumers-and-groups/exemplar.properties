# clickstream-processors consumer group configuration

group.id=clickstream-processors

# Incremental cooperative rebalancing — only moved partitions pause.
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# Heartbeat-based failure detection: dead within 45s, heartbeat every 15s (~1/3).
session.timeout.ms=45000
heartbeat.interval.ms=15000

# Application-stall detection: tolerate up to 5 minutes of slow processing
# between poll() calls without being kicked from the group.
max.poll.interval.ms=300000
max.poll.records=500

# Manual commit after processing — see the offset-management lesson.
enable.auto.commit=false
