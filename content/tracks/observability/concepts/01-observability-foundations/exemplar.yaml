# prometheus.yml — minimal scrape configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'web-app'
    scrape_interval: 10s
    static_configs:
      - targets: ['web-app:8080']
        labels:
          env: production
