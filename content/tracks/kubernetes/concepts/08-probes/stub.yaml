apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
    - name: app
      image: app:1.0
      # TODO: livenessProbe -> httpGet /healthz:8080, initialDelaySeconds 15,
      #       periodSeconds 10, timeoutSeconds 2, failureThreshold 3
      livenessProbe:
        httpGet:
          path:
          port:
        initialDelaySeconds:
        periodSeconds:
        timeoutSeconds:
        failureThreshold:
      # TODO: readinessProbe -> httpGet /ready:8080, periodSeconds 5, failureThreshold 3
      readinessProbe:
        httpGet:
          path:
          port:
        periodSeconds:
        failureThreshold:
      # TODO: startupProbe -> httpGet /startupz:8080, failureThreshold 30, periodSeconds 10
      startupProbe:
        httpGet:
          path:
          port:
        failureThreshold:
        periodSeconds:
