apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  # TODO: nodeSelector -> disktype: ssd
  nodeSelector:
  affinity:
    nodeAffinity:
      # TODO: required node affinity -> kubernetes.io/arch In [amd64]
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key:
                operator:
                values:
      # TODO: preferred node affinity -> weight 50, zone In [us-east-1a]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight:
          preference:
            matchExpressions:
              - key:
                operator:
                values:
    # TODO: required pod anti-affinity -> app: web, topologyKey kubernetes.io/hostname
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
          topologyKey:
  # TODO: tolerations -> dedicated=gpu:NoSchedule
  tolerations:
    - key:
      operator:
      value:
      effect:
  # TODO: topologySpreadConstraints -> maxSkew 1, zone key, DoNotSchedule, app: web
  topologySpreadConstraints:
    - maxSkew:
      topologyKey:
      whenUnsatisfiable:
      labelSelector:
        matchLabels:
  containers:
    - name: web
      image: web:1.0
