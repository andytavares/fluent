apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-app
spec:
  containers:
    - name: app
      image: app:1.0
      # TODO: Guaranteed QoS — requests MUST equal limits for both cpu and memory
      resources:
        requests:
          cpu:
          memory:
        limits:
          cpu:
          memory:

---
apiVersion: v1
kind: Pod
metadata:
  name: burstable-app
spec:
  containers:
    - name: app
      image: app:1.0
      # TODO: Burstable QoS — limits ABOVE requests for at least one resource
      resources:
        requests:
          cpu:
          memory:
        limits:
          cpu:
          memory:
