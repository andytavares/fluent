apiVersion: v1
kind: Pod
metadata:
  name: guaranteed-app
spec:
  containers:
    - name: app
      image: app:1.0
      resources:
        requests:
          cpu: "500m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

---
apiVersion: v1
kind: Pod
metadata:
  name: burstable-app
spec:
  containers:
    - name: app
      image: app:1.0
      resources:
        requests:
          cpu: "250m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
