    name:
    namespace:
# TODO: roleRef -> Role pod-reader-role, apiGroup rbac.authorization.k8s.io
roleRef:
  kind:
  name:
  apiGroup:

---
apiVersion: v1
kind: Pod
metadata:
  name: watcher
spec:
  # TODO: serviceAccountName -> pod-reader
  serviceAccountName:
  containers:
    - name: watcher
      image: watcher:1.0
