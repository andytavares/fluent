rules:
  - apiGroups:
    resources:
    verbs:

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
# TODO: subjects -> ServiceAccount pod-reader in namespace default
